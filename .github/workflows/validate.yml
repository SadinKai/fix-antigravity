name: Validate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  windows:
    name: Windows / ${{ matrix.shell }}
    runs-on: windows-2025
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6, official tag inspected 2026-10-14
        with:
          persist-credentials: false
      - name: Validate in the selected runtime
        shell: ${{ matrix.shell }}
        run: |
          $ErrorActionPreference = 'Stop'
          $PSVersionTable | Format-Table -AutoSize
          .\scripts\validate.ps1
